name: LinkedIn Cloud Autopilot

on:
  schedule:
    # Runs Tuesday, Thursday, Friday at 02:45 UTC (8:15 AM IST) and Sunday at 11:00 UTC (4:30 PM IST)
    - cron: '45 2 * * 2,4,5'
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (send Telegram alert without publishing to LinkedIn)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Autopilot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python scripts/cloud_autopilot.py

      - name: Commit and Push Log Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my_account/
          if git diff --staged --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "chore: update LinkedIn post queue and publishing log [skip ci]"
            git push
          fi
